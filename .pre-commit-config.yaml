default_stages: [ pre-commit ]

repos:
  - repo: https://github.com/pycqa/isort
    rev: 9.0.0b2
    hooks:
      - id: isort
        args: ['--profile', 'black']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: [ --fix ]

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        args: ['--line-length', '120']