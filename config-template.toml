[video]
fps = 24
background_audio = "./resource/bgm.mp3"
width = 1080
height = 1920

[video.title]
font = "./fonts/DreamHanSans-W20.ttc"
width_ratio = 0.8
font_size_ratio = 12
position_ratio = 0.5
color = "white"
stroke_color = "black"
stroke_width = 2
text_align = "center"
duration = 0.5

[video.subtitle]
font = "./fonts/DreamHanSans-W20.ttc"
width_ratio = 0.8
font_size_ratio = 17
position_ratio = 0.667
color = "white"
stroke_color = "black"
stroke_width = 1
text_align = "center"
interval = 0.2

[api]
database_url = "sqlite+aiosqlite:///tasks.db"
app_port = 8000
max_concurrent_tasks = 1
task_timeout_seconds = 600

[material]
source = "pixabay"
minimum_duration = 10
prompt = """### 角色：批量视频搜索词生成器

#### 目标：
根据输入的 JSON 数据（包含相声对话内容），为每个 `content` 字段生成 5 个相关的英语视频搜索词，用于在视频素材库（如 Pixabay / Pexels）中检索高质量匹配画面。

#### 硬性约束：
1. **输出必须是一个 JSON 数组**，数组元素顺序与输入 `content` 的 `id` 一一对应，不允许用对象包裹、不允许添加 `count` 字段。
2. **每个 `content` 字段必须生成恰好 5 个搜索词**，即数组的每个元素必须包含一个长度为 5 的 `search_terms` 数组。
3. 数组长度必须与输入段落的数量完全一致。
4. 所有搜索词必须是**英文**，不允许使用中文。
5. 不返回原始对话内容，仅返回每个 `id` 和对应的 5 个搜索词。

#### 搜索词质量要求：
1. 每个搜索词应由 **1~3 个英文单词** 组成，单词之间用空格分隔；
2. 必须**紧扣该段对话的核心主题或情节**，能从对话中推断出的关键实体、动作、场景或意象；
3. 优先使用**具体、画面感强、可被视觉检索到**的词语（如具体物体、地点、人物动作），避免抽象概念；
4. 5 个搜索词应**互不相同、角度多样**（分别覆盖主体、场景、动作、氛围、物件等维度），避免同义重复；
5. 避免过于宽泛或无区分度的泛词（如 `video`、`people`、`technology` 单独出现），除非是段落最核心的意象。

#### 输入格式：
```json
[
  {
    "id": 1,
    "content": "台词内容1"
  },
  {
    "id": 2,
    "content": "台词内容2"
  }
]
```

#### 输出格式（严格遵循，直接输出数组，不要用对象包裹）：
```json
[
  {
    "id": 1,
    "search_terms": ["term 1", "term 2", "term 3", "term 4", "term 5"]
  },
  {
    "id": 2,
    "search_terms": ["term 1", "term 2", "term 3", "term 4", "term 5"]
  }
]
```
"""

[material.pexels]
api_key = "XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
locale = "zh-CN"

[material.pixabay]
api_key = "XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
lang = "zh"
video_type = "all"
