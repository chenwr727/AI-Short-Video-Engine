<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>设置</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --card: #ffffff;
        --border: #e3e9f2;
        --text: #1c2431;
        --muted: #6b7787;
        --brand: #2f6fed;
        --ok: #12a15c;
        --err: #d9453d;
        --warn: #b8791a;
        font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        /* 只有中间内容区滚动 */
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      .page {
        flex: 1 1 auto;
        overflow-y: auto;
        /* 始终预留滚动槽，避免内容左右晃动 */
        scrollbar-gutter: stable;
        padding: 20px 24px;
      }
      .page > * {
        max-width: 780px;
        margin-left: auto;
        margin-right: auto;
      }

      header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 18px;
        margin: 0;
      }
      .file {
        margin-left: auto;
        font-size: 11px;
        color: var(--muted);
        word-break: break-all;
        text-align: right;
        max-width: 60%;
      }

      /* 分组可折叠，避免字段全铺开过长 */
      details.group {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        margin-bottom: 12px;
        overflow: hidden;
      }
      details.group > summary {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 16px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        list-style: none;
        user-select: none;
      }
      details.group > summary::-webkit-details-marker {
        display: none;
      }
      details.group > summary::before {
        content: "";
        width: 0;
        height: 0;
        border-left: 5px solid var(--muted);
        border-top: 4px solid transparent;
        border-bottom: 4px solid transparent;
        transition: transform 0.15s;
        flex: none;
      }
      details.group[open] > summary::before {
        transform: rotate(90deg);
      }
      details.group[open] > summary {
        border-bottom: 1px solid var(--border);
      }
      .tag {
        margin-left: auto;
        font-size: 11px;
        font-weight: 400;
        color: var(--muted);
      }
      .tag.ok {
        color: var(--ok);
      }
      .body {
        padding: 14px 16px 4px;
      }

      /* 标签固定宽度，输入框左边界对齐 */
      .field {
        display: grid;
        grid-template-columns: 150px 1fr;
        align-items: center;
        gap: 4px 12px;
        margin-bottom: 10px;
      }
      label.lbl {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.4;
      }
      label.lbl .hint {
        display: block;
        font-size: 11px;
        color: #98a3b2;
      }
      input[type="text"],
      input[type="password"] {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 7px 10px;
        font-size: 13px;
        font-family: inherit;
        background: #fbfcfe;
        outline: none;
        transition: border-color 0.15s, background 0.15s;
      }
      input:focus {
        border-color: var(--brand);
        background: #fff;
      }
      input.invalid {
        border-color: var(--err);
        background: #fff8f7;
      }
      .field-error {
        grid-column: 2;
        font-size: 11px;
        color: var(--err);
        margin-top: -2px;
      }
      .field-error:empty {
        display: none;
      }
      .with-unit {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .with-unit .unit {
        font-size: 11px;
        color: var(--muted);
        flex: none;
        min-width: 20px;
      }
      .check {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
        font-size: 12px;
        padding-left: 162px;
      }
      .check input {
        width: 15px;
        height: 15px;
        flex: none;
      }
      .note {
        margin: 0 0 12px;
        padding: 8px 10px;
        border-left: 3px solid #cfe0fb;
        background: #f6f9ff;
        border-radius: 0 7px 7px 0;
        font-size: 11px;
        line-height: 1.65;
        color: #5d6f8c;
      }

      .test-row {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin: 2px 0 12px 162px;
      }
      .test-result {
        font-size: 11px;
        line-height: 1.5;
        color: var(--muted);
        word-break: break-word;
        min-width: 0;
      }
      .test-result.ok {
        color: var(--ok);
      }
      .test-result.err {
        color: var(--err);
      }

      button {
        border-radius: 9px;
        padding: 9px 18px;
        font-size: 13px;
        font-family: inherit;
        cursor: pointer;
        border: 1px solid var(--border);
        background: #fff;
        color: var(--text);
        transition: background 0.15s, border-color 0.15s, color 0.15s;
      }
      button:hover:not(:disabled) {
        border-color: #c3cfdd;
      }
      button.primary {
        background: var(--brand);
        border-color: var(--brand);
        color: #fff;
        font-weight: 600;
      }
      button.primary:hover:not(:disabled) {
        background: #2a62d4;
      }
      button.link {
        padding: 3px 8px;
        font-size: 11px;
        color: var(--muted);
        border-color: transparent;
        background: transparent;
      }
      button.link:hover:not(:disabled) {
        color: var(--brand);
        background: #f1f6ff;
      }
      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .bar {
        flex: none;
        padding: 11px 24px;
        background: #fff;
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .status {
        margin-right: auto;
        font-size: 12px;
        color: var(--muted);
        min-width: 0;
        line-height: 1.4;
        word-break: break-word;
      }
      .status.ok {
        color: var(--ok);
      }
      .status.err {
        color: var(--err);
      }
      .status.warn {
        color: var(--warn);
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <h1>设置</h1>
        <label class="check-inline" style="margin: 0 0 0 8px; padding: 0">
          <input type="checkbox" id="reveal" />
          <span style="font-size: 12px; color: #6b7787">显示密钥</span>
        </label>
        <div class="file" id="config-path">加载中…</div>
      </header>

      <form id="form" novalidate>
        <details class="group" open>
          <summary>大模型（写稿）<span class="tag" id="tag-llm">未配置</span></summary>
          <div class="body">
            <div class="field">
              <label class="lbl">API Key</label>
              <input type="password" data-key="LLM_API_KEY" autocomplete="off" spellcheck="false" />
            </div>
            <div class="field">
              <label class="lbl">接口地址<span class="hint">可只填域名</span></label>
              <input
                type="text"
                data-key="LLM_API_URL"
                placeholder="https://api.deepseek.com"
                spellcheck="false"
                data-text="1"
              />
            </div>
            <div class="field">
              <label class="lbl">模型</label>
              <input type="text" data-key="LLM_MODEL" placeholder="deepseek-flash" spellcheck="false" data-text="1" />
            </div>
            <div class="test-row">
              <button type="button" class="link" data-test="llm">测试连接</button>
              <span class="test-result" id="test-llm"></span>
            </div>
          </div>
        </details>

        <details class="group">
          <summary>配音（通用）</summary>
          <div class="body">
            <p class="note">Edge 在线语音免费、无需 Key，是默认配音。下面两个引擎填了 Key 才会出现在「配音设置」里。</p>
            <div class="field">
              <label class="lbl">语速<span class="hint">1 = 原速</span></label>
              <div class="with-unit">
                <input type="text" data-key="TTS_SPEED" placeholder="1.1" data-num="0.5,2" data-unit="倍" />
              </div>
            </div>
          </div>
        </details>

        <details class="group">
          <summary>配音（DashScope · CosyVoice）<span class="tag" id="tag-dashscope">未配置</span></summary>
          <div class="body">
            <div class="field">
              <label class="lbl">API Key</label>
              <input type="password" data-key="DASHSCOPE_API_KEY" autocomplete="off" spellcheck="false" />
            </div>
            <div class="field">
              <label class="lbl">HTTP 地址</label>
              <input
                type="text"
                data-key="DASHSCOPE_BASE_URL"
                placeholder="https://dashscope.aliyuncs.com/api/v1"
                spellcheck="false"
                data-text="1"
              />
            </div>
            <div class="field">
              <label class="lbl">WebSocket 地址<span class="hint">留空自动推导</span></label>
              <input
                type="text"
                data-key="DASHSCOPE_WS_URL"
                placeholder="wss://…/api-ws/v1/inference"
                spellcheck="false"
                data-text="1"
              />
            </div>
            <div class="field">
              <label class="lbl">业务空间 ID<span class="hint">留空用默认空间</span></label>
              <input
                type="text"
                data-key="DASHSCOPE_WORKSPACE_ID"
                placeholder="llm-xxxxxxxx"
                spellcheck="false"
                data-text="1"
              />
            </div>
            <div class="field">
              <label class="lbl">CosyVoice 模型</label>
              <input
                type="text"
                data-key="TTS_COSYVOICE_MODEL"
                placeholder="cosyvoice-v3-flash"
                spellcheck="false"
                data-text="1"
              />
            </div>
            <div class="test-row">
              <button type="button" class="link" data-test="dashscope">测试连接</button>
              <span class="test-result" id="test-dashscope"></span>
            </div>
          </div>
        </details>

        <details class="group">
          <summary>配音（豆包 · 火山引擎）<span class="tag" id="tag-seed">未配置</span></summary>
          <div class="body">
            <p class="note">
              不填 Key 时不会出现豆包引擎。音色已内置（小何、Vivi、云舟、大壹、猴哥等），在「配音设置」里按角色选。
            </p>
            <div class="field">
              <label class="lbl">API Key</label>
              <input type="password" data-key="SEED_TTS_API_KEY" autocomplete="off" spellcheck="false" />
            </div>
            <div class="field">
              <label class="lbl">资源 ID</label>
              <input
                type="text"
                data-key="TTS_SEED_RESOURCE_ID"
                placeholder="seed-tts-2.0"
                spellcheck="false"
                data-text="1"
              />
            </div>
            <div class="field">
              <label class="lbl">模型</label>
              <input
                type="text"
                data-key="TTS_SEED_MODEL"
                placeholder="seed-tts-2.0-expressive"
                spellcheck="false"
                data-text="1"
              />
            </div>
          </div>
        </details>

        <details class="group">
          <summary>剧本角色名</summary>
          <div class="body">
            <p class="note">
              这两个名字会写进 AI 的写稿要求里（双人风格用两个，脱口秀只用主讲）。在「文案脚本」页可以按任务临时改。
            </p>
            <div class="field">
              <label class="lbl">主讲角色名<span class="hint">最多 8 字</span></label>
              <input type="text" data-key="SPEAKER_MAIN" placeholder="小简" data-max="8" />
            </div>
            <div class="field">
              <label class="lbl">追问角色名<span class="hint">最多 8 字</span></label>
              <input type="text" data-key="SPEAKER_GUEST" placeholder="老陈" data-max="8" />
            </div>
          </div>
        </details>

        <details class="group">
          <summary>素材<span class="tag" id="tag-material">未配置 Key</span></summary>
          <div class="body">
            <div class="field">
              <label class="lbl">Pixabay Key</label>
              <input type="password" data-key="PIXABAY_API_KEY" autocomplete="off" spellcheck="false" />
            </div>
            <div class="field">
              <label class="lbl">Pexels Key</label>
              <input type="password" data-key="PEXELS_API_KEY" autocomplete="off" spellcheck="false" />
            </div>
            <div class="field">
              <label class="lbl">素材最短时长</label>
              <div class="with-unit">
                <input type="text" data-key="MATERIAL_MIN_DURATION" placeholder="10" data-num="1,120" data-unit="秒" />
              </div>
            </div>
            <label class="check"><input type="checkbox" data-key="VISION_SELECT" /> 看缩略图选片（需要模型支持图片输入，失败会自动回退到标签选片）</label>
            <div class="field">
              <label class="lbl">每段镜头数<span class="hint">1 = 整段只用一条素材</span></label>
              <div class="with-unit">
                <input type="text" data-key="SHOTS_PER_PARAGRAPH" placeholder="2" data-num="1,3" data-unit="个" data-int="1" />
              </div>
            </div>
            <label class="check"><input type="checkbox" data-key="QUOTE_FALLBACK" /> 没素材时改用设计卡（不中断出片）</label>
          </div>
        </details>

        <details class="group">
          <summary>画面</summary>
          <div class="body">
            <div class="field">
              <label class="lbl">宽</label>
              <div class="with-unit">
                <input
                  type="text"
                  data-key="VIDEO_WIDTH"
                  placeholder="1080"
                  data-num="360,3840"
                  data-unit="px"
                  data-int="1"
                />
              </div>
            </div>
            <div class="field">
              <label class="lbl">高</label>
              <div class="with-unit">
                <input
                  type="text"
                  data-key="VIDEO_HEIGHT"
                  placeholder="1920"
                  data-num="360,3840"
                  data-unit="px"
                  data-int="1"
                />
              </div>
            </div>
            <div class="field">
              <label class="lbl">帧率</label>
              <div class="with-unit">
                <input type="text" data-key="FPS" placeholder="24" data-num="1,120" data-unit="fps" data-int="1" />
              </div>
            </div>
            <div class="field">
              <label class="lbl">画面淡入<span class="hint">0 = 关闭</span></label>
              <div class="with-unit">
                <input type="text" data-key="VIDEO_FADE_IN" placeholder="0.5" data-num="0,5" data-unit="秒" />
              </div>
            </div>
            <div class="field">
              <label class="lbl">画面淡出<span class="hint">0 = 关闭</span></label>
              <div class="with-unit">
                <input type="text" data-key="VIDEO_FADE_OUT" placeholder="0.5" data-num="0,5" data-unit="秒" />
              </div>
            </div>
            <div class="field">
              <label class="lbl">运镜强度<span class="hint">0 = 静止画面</span></label>
              <div class="with-unit">
                <input type="text" data-key="CAMERA_MOTION" placeholder="6" data-num="0,10" data-unit="级" data-int="1" />
              </div>
            </div>
            <div class="field">
              <label class="lbl">调色强度<span class="hint">0 = 不调色</span></label>
              <div class="with-unit">
                <input type="text" data-key="COLOR_GRADE" placeholder="5" data-num="0,10" data-unit="级" data-int="1" />
              </div>
            </div>
          </div>
        </details>

        <details class="group">
          <summary>字幕与节奏</summary>
          <div class="body">
            <div class="field">
              <label class="lbl">字幕字号<span class="hint">0 = 自动</span></label>
              <div class="with-unit">
                <input
                  type="text"
                  data-key="SUBTITLE_FONT_SIZE"
                  placeholder="0"
                  data-num="0,300"
                  data-unit="px"
                  data-int="1"
                />
              </div>
            </div>
            <div class="field">
              <label class="lbl">片头标题停留<span class="hint">0 = 不显示标题</span></label>
              <div class="with-unit">
                <input type="text" data-key="TITLE_DURATION" placeholder="1.6" data-num="0,30" data-unit="秒" />
              </div>
            </div>
            <label class="check"><input type="checkbox" data-key="INTRO_ENABLED" /> 用 Remotion 模板渲染片头（需要先安装 remotion/ 依赖，失败自动回退）</label>
            <div class="field">
              <label class="lbl">片尾时长<span class="hint">0 = 不加片尾</span></label>
              <div class="with-unit">
                <input type="text" data-key="OUTRO_DURATION" placeholder="0" data-num="0,15" data-unit="秒" />
              </div>
            </div>
            <div class="field">
              <label class="lbl">片尾标题</label>
              <div class="with-unit">
                <input type="text" data-key="OUTRO_TITLE" placeholder="关注我，下期见" data-text="1" />
              </div>
            </div>
            <div class="field">
              <label class="lbl">片尾账号<span class="hint">留空不显示</span></label>
              <div class="with-unit">
                <input type="text" data-key="OUTRO_HANDLE" placeholder="@你的账号" data-text="1" />
              </div>
            </div>
            <label class="check"><input type="checkbox" data-key="CHAPTER_CARD" /> 段落之间插入过场卡（需要 remotion/ 依赖）</label>
            <div class="field">
              <label class="lbl">过场卡时长<span class="hint">太短会被转场吃掉</span></label>
              <div class="with-unit">
                <input type="text" data-key="CHAPTER_DURATION" placeholder="2" data-num="0.5,10" data-unit="秒" />
              </div>
            </div>
            <div class="field">
              <label class="lbl">相邻台词间隔<span class="hint">0 = 紧接</span></label>
              <div class="with-unit">
                <input type="text" data-key="SUBTITLE_INTERVAL" placeholder="0.2" data-num="0,10" data-unit="秒" />
              </div>
            </div>
            <div class="field">
              <label class="lbl">段落转场<span class="hint">0 = 关闭</span></label>
              <div class="with-unit">
                <input type="text" data-key="TRANSITION_DURATION" placeholder="0.5" data-num="0,10" data-unit="秒" />
              </div>
            </div>
            <div class="field">
              <label class="lbl">转场风格<span class="hint">fade 或 mixed</span></label>
              <div class="with-unit">
                <input type="text" data-key="TRANSITION_STYLE" placeholder="mixed" data-text="1" />
              </div>
            </div>
          </div>
        </details>

        <details class="group">
          <summary>背景音乐</summary>
          <div class="body">
            <label class="check"><input type="checkbox" data-key="BGM_ENABLED" /> 混入 BGM（关掉后只保留配音）</label>
            <div class="field">
              <label class="lbl">BGM 音量<span class="hint">1 = 原音量</span></label>
              <div class="with-unit">
                <input type="text" data-key="BGM_VOLUME" placeholder="0.1" data-num="0,4" data-unit="倍" />
              </div>
            </div>
            <div class="field">
              <label class="lbl">BGM 淡入<span class="hint">0 = 关闭</span></label>
              <div class="with-unit">
                <input type="text" data-key="AUDIO_FADE_IN" placeholder="0.8" data-num="0,30" data-unit="秒" />
              </div>
            </div>
            <div class="field">
              <label class="lbl">BGM 淡出<span class="hint">0 = 关闭</span></label>
              <div class="with-unit">
                <input type="text" data-key="AUDIO_FADE_OUT" placeholder="1.2" data-num="0,30" data-unit="秒" />
              </div>
            </div>
            <label class="check"><input type="checkbox" data-key="SFX_ENABLED" /> 转场与片头音效</label>
            <div class="field">
              <label class="lbl">音效音量<span class="hint">1 = 原音量</span></label>
              <div class="with-unit">
                <input type="text" data-key="SFX_VOLUME" placeholder="0.2" data-num="0,2" data-unit="倍" />
              </div>
            </div>
          </div>
        </details>
      </form>
    </div>

    <div class="bar">
      <span class="status" id="status"></span>
      <button type="button" class="link" id="reset">恢复默认值</button>
      <button type="button" id="cancel">取消</button>
      <button type="button" class="primary" id="save">保存并重启后端</button>
    </div>

    <script>
      const form = document.getElementById("form");
      const status = document.getElementById("status");
      const inputs = Array.from(form.querySelectorAll("input[data-key]"));
      const saveButton = document.getElementById("save");
      const resetButton = document.getElementById("reset");

      let defaults = {};
      /** 加载时的快照，用于判断是否有未保存修改 */
      let loaded = {};

      function say(text, kind) {
        status.textContent = text;
        status.className = `status ${kind ?? ""}`;
      }

      function isToggle(input) {
        return input.type === "checkbox";
      }

      function isOn(value, fallback) {
        const text = String(value ?? "").trim().toLowerCase();
        if (!text) return fallback;
        return !["0", "false", "off", "no"].includes(text);
      }

      function errorSlot(input) {
        const field = input.closest(".field");
        if (!field) return null;
        let slot = field.querySelector(".field-error");
        if (!slot) {
          slot = document.createElement("div");
          slot.className = "field-error";
          field.appendChild(slot);
        }
        return slot;
      }

      function setInvalid(input, message) {
        input.classList.toggle("invalid", Boolean(message));
        const slot = errorSlot(input);
        if (slot) slot.textContent = message ?? "";
      }

      /** data-num="最小,最大"，data-int="1" 要求整数；空值合法，后端会回退默认值 */
      function checkNumber(input) {
        if (!input.dataset.num) return "";
        const raw = input.value.trim();
        if (!raw) return "";

        const [minText, maxText] = input.dataset.num.split(",");
        const min = Number(minText);
        const max = Number(maxText);
        const unit = input.dataset.unit ?? "";

        // 带单位会被后端当成非法值静默回退默认值
        if (!/^\d+(\.\d+)?$/.test(raw)) return "只能填数字，不要带单位或字母";
        let n = Number(raw);
        if (input.dataset.int === "1" && !Number.isInteger(n)) return "请填整数";

        if (n < min) return `不能小于 ${min}${unit}`;
        if (n > max) return `不能大于 ${max}${unit}`;
        return "";
      }

      function checkText(input) {
        if (!input.dataset.max) return "";
        const raw = input.value.trim();
        if (!raw) return "";
        if (raw.length > Number(input.dataset.max)) return `最多 ${input.dataset.max} 个字`;
        return "";
      }

      function validateInput(input) {
        if (isToggle(input)) return "";
        return checkNumber(input) || checkText(input);
      }

      function validateAll() {
        let first = null;
        for (const input of inputs) {
          const message = validateInput(input);
          setInvalid(input, message);
          if (message && !first) first = input;
        }
        return first;
      }

      function collect() {
        const values = {};
        for (const input of inputs) {
          values[input.dataset.key] = isToggle(input) ? (input.checked ? "1" : "0") : input.value.trim();
        }
        return values;
      }

      function isDirty() {
        const now = collect();
        return Object.keys(now).some((k) => now[k] !== loaded[k]);
      }

      /** 分组标题右侧的配置状态，省的为确认是否填过而展开 */
      function refreshTags() {
        const v = collect();
        const set = (id, text, on) => {
          const el = document.getElementById(id);
          el.textContent = text;
          el.classList.toggle("ok", Boolean(on));
        };
        const llm = Boolean(v.LLM_API_KEY && v.LLM_API_URL && v.LLM_MODEL);
        set("tag-llm", llm ? "已配置" : "未配置", llm);
        const ds = Boolean(v.DASHSCOPE_API_KEY);
        set("tag-dashscope", ds ? "已配置" : "未配置", ds);
        const seed = Boolean(v.SEED_TTS_API_KEY);
        set("tag-seed", seed ? "已配置" : "未配置", seed);
        const keys = [v.PIXABAY_API_KEY, v.PEXELS_API_KEY].filter(Boolean).length;
        set("tag-material", keys ? `${keys} 个 Key` : "未配置 Key", keys > 0);
      }

      function reveal(input) {
        const details = input.closest("details");
        if (details) details.open = true;
        input.scrollIntoView({ block: "center", behavior: "smooth" });
        input.focus({ preventScroll: true });
      }

      function applyReveal(checked) {
        for (const input of inputs) {
          if (input.dataset.secret === "1") input.type = checked ? "text" : "password";
        }
      }

      async function load() {
        const config = await window.aisv.getConfig();
        defaults = config.__defaults ?? {};
        for (const input of inputs) {
          const key = input.dataset.key;
          if (isToggle(input)) {
            input.checked = isOn(config[key], true);
            continue;
          }
          input.value = config[key] ?? "";
          if (input.type === "password") input.dataset.secret = "1";
        }
        loaded = collect();
        document.getElementById("config-path").textContent = `${config.__file ?? ""}`;
        refreshTags();
        say("");
      }

      form.addEventListener("input", (event) => {
        const input = event.target;
        if (!(input instanceof HTMLInputElement) || !input.dataset.key) return;
        setInvalid(input, validateInput(input));
        refreshTags();
      });

      form.addEventListener("change", (event) => {
        if (event.target instanceof HTMLInputElement && event.target.dataset.key) refreshTags();
      });

      document.getElementById("reveal").addEventListener("change", (event) => {
        applyReveal(event.target.checked);
      });

      for (const button of form.querySelectorAll("button[data-test]")) {
        button.addEventListener("click", async () => {
          const target = button.dataset.test;
          const output = document.getElementById(`test-${target}`);
          const bad = Array.from(inputs).filter((i) => validateInput(i));
          if (bad.length) {
            say("有字段格式不对，先修正再测试", "err");
            reveal(bad[0]);
            return;
          }
          button.disabled = true;
          output.className = "test-result";
          output.textContent = "测试中…";
          try {
            const result = await window.aisv.testConfig(target, collect());
            output.className = `test-result ${result.ok ? "ok" : "err"}`;
            const cost = result.ms >= 1000 ? `${(result.ms / 1000).toFixed(1)}s` : `${result.ms}ms`;
            output.textContent = result.ok
              ? `通过（${cost}）· ${result.message}`
              : `失败（${cost}）· ${result.message}`;
          } catch (error) {
            output.className = "test-result err";
            output.textContent = `失败 · ${error.message ?? error}`;
          } finally {
            button.disabled = false;
          }
        });
      }

      resetButton.addEventListener("click", () => {
        if (!Object.keys(defaults).length) return;
        // 默认值里 Key 为空，恢复会清掉已填密钥，先确认
        const secretCount = inputs.filter(
          (i) => i.dataset.secret === "1" && i.value.trim() && !defaults[i.dataset.key],
        ).length;
        if (secretCount && !confirm(`默认值里密钥为空，恢复后将清空 ${secretCount} 个已填的 Key。继续吗？`)) return;
        for (const input of inputs) {
          const key = input.dataset.key;
          if (isToggle(input)) input.checked = isOn(defaults[key], true);
          else input.value = defaults[key] ?? "";
          setInvalid(input, "");
        }
        refreshTags();
        say("已填入默认值，点「保存并重启后端」才会生效", "warn");
      });

      saveButton.addEventListener("click", async () => {
        const bad = validateAll();
        if (bad) {
          say("有字段格式不对，已在对应项下方标出", "err");
          reveal(bad);
          return;
        }
        saveButton.disabled = true;
        resetButton.disabled = true;
        try {
          await window.aisv.saveConfig(collect());
          say("已保存，正在重启后端…", "ok");
          const restarted = await window.aisv.restartBackend();
          if (!restarted.ok) throw new Error(restarted.error ?? "重启失败");
          if (restarted.reused) {
            // 外部启动的后端主进程停不掉，需用户手动重启
            say("已保存。当前后端是手动启动的（pnpm dev:server），需要手动重启才会加载新配置", "warn");
            saveButton.disabled = false;
            resetButton.disabled = false;
            return;
          }
          loaded = collect();
          say("已生效", "ok");
          setTimeout(() => window.aisv.close(), 600);
        } catch (error) {
          say(String(error?.message ?? error), "err");
          saveButton.disabled = false;
          resetButton.disabled = false;
        }
      });

      document.getElementById("cancel").addEventListener("click", () => {
        if (isDirty() && !confirm("有修改还没保存，确定关闭吗？")) return;
        window.aisv.close();
      });

      load().catch((error) => say(`读取配置失败：${error?.message ?? error}`, "err"));
    </script>
  </body>
</html>
